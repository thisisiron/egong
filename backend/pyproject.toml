[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "egong-api"
version = "0.1.0"
description = "FastAPI backend for Egong academy ERP (domain-driven)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "supabase>=2.9.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "respx>=0.21.0",
    "psycopg[binary]>=3.3.0",
]
# Migrations are applied via scripts/apply_migration.py (psycopg → session pooler).
# Kept as an optional extra to avoid forcing it on app runtime.
migrations = [
    "psycopg[binary]>=3.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "rls: DB 직결 권한 경계 테스트 (DATABASE_URL 필요, 기본 실행에서 제외)",
]
addopts = "-m 'not rls'"

[tool.ruff]
line-length = 100
target-version = "py311"

# 규칙셋을 명시적으로 고정한다. select를 비워두면 "ruff의 그때 기본값"을 따르게 되는데,
# 그 기본값은 버전에 따라 넓어진다 — 실제로 0.16.1로 올라가며 BLE001/SIM117/DTZ011 등이
# 새로 켜져 기존 코드에서 28건이 한꺼번에 떴다. 아래 목록은 0.7~0.13의 기본값과 동일해서
# 지금까지의 게이트를 그대로 유지하며, 이제는 ruff를 올려도 결과가 변하지 않는다.
# (새로 뜬 규칙들을 채택할지는 별도 판단 — 채택하려면 여기에 추가하고 코드를 함께 고칠 것.)
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# E402(모듈 레벨 import가 파일 최상단이 아님)를 어길 수밖에 없는 두 파일. 둘 다
# import보다 먼저 실행돼야 하는 것이 있다 — sys.path 조작(스크립트/시드 패키지를
# 얹는다)과 load_dotenv(). 순서를 지키는 것이 규칙보다 우선이라 파일 단위로 면제한다.
[tool.ruff.lint.per-file-ignores]
"scripts/seed_dev_accounts.py" = ["E402"]
"tests/rls/conftest.py" = ["E402"]
